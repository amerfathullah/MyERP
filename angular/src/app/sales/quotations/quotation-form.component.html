<abp-page [title]="'New Quotation'">
  <form [formGroup]="form" (ngSubmit)="save()" (appSaveShortcut)="save()">
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="card-title mb-0"><i class="fa fa-file-alt me-2"></i>{{ '::QuotationDetails' | abpLocalization }}</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-12 col-md-4 mb-3">
            <label class="form-label">{{ '::QuotationNumber' | abpLocalization }}</label>
            <input type="text" class="form-control" formControlName="quotationNumber" [class.is-invalid]="form.get('quotationNumber')?.invalid && form.get('quotationNumber')?.touched" [placeholder]="'::Placeholder:AutoGenerated' | abpLocalization" />
          </div>
          <div class="col-12 col-md-4 mb-3">
            <label class="form-label">{{ '::Date' | abpLocalization }}</label>
            <input type="date" class="form-control" formControlName="quotationDate" [class.is-invalid]="form.get('quotationDate')?.invalid && form.get('quotationDate')?.touched" />
          </div>
          <div class="col-12 col-md-4 mb-3">
            <label class="form-label">{{ '::ValidUntil' | abpLocalization }}</label>
            <input type="date" class="form-control" formControlName="validUntil" [class.is-invalid]="form.get('validUntil')?.invalid && form.get('validUntil')?.touched" />
          </div>
          <div class="col-12 col-md-8 mb-3">
            <label class="form-label">{{ '::Customer' | abpLocalization }}</label>
            <select class="form-select" formControlName="customerId" [class.is-invalid]="form.get('customerId')?.invalid && form.get('customerId')?.touched">
              <option value="">Select customer...</option>
              @for (c of customers(); track c.id) {
                <option [value]="c.id">{{ c.customerName ?? c.name }}</option>
              }
            </select>
          </div>
          <div class="col-12 col-md-6 mb-3">
            <label class="form-label">{{ 'PriceList' | abpLocalization }}</label>
            <select class="form-select" formControlName="priceListId">
              <option value="">— {{ '::Default' | abpLocalization }} —</option>
              @for (pl of priceLists(); track pl.id) {
                <option [value]="pl.id">{{ pl.name }}</option>
              }
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h5 class="card-title mb-0"><i class="fa fa-list me-2"></i>Items</h5>
      </div>
      <div class="card-body">
        <app-invoice-item-grid [items]="items" transactionType="Selling" [companyId]="form.get('companyId')?.value || ''" [customerId]="form.get('customerId')?.value || ''" [priceListId]="form.get('priceListId')?.value || ''" (rowChanged)="recalculate()" />
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="d-flex flex-column align-items-end gap-1">
          <div class="d-flex justify-content-between" style="width: 220px">
            <small class="text-muted">{{ '::NetTotal' | abpLocalization }}</small>
            <span class="font-monospace">{{ calcResult.netTotal | number:'1.2-2' }}</span>
          </div>
          <div class="d-flex justify-content-between border-top pt-2 mt-1" style="width: 220px">
            <span class="fw-semibold">{{ '::GrandTotal' | abpLocalization }}</span>
            <span class="font-monospace fw-bold">{{ calcResult.grandTotal | number:'1.2-2' }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()"><i class="fa fa-times me-1"></i>{{ '::Cancel' | abpLocalization }}</button>
      <button type="button" class="btn btn-outline-secondary" (click)="recalculate()"><i class="fa fa-calculator me-1"></i> {{ '::Recalculate' | abpLocalization }}</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        <i class="fa fa-save me-1"></i> Save Draft
      </button>
    </div>
  </form>
</abp-page>
