# =============================================================================
# MyERP — Self-Hosted with HTTPS (Traefik + Let's Encrypt)
# =============================================================================
# Web  -> https://${WEB_DOMAIN}      (e.g. erp.mosalah.cloud)
# API  -> https://${API_DOMAIN}      (e.g. erp-api.mosalah.cloud)
# Usage:
#   Set WEB_DOMAIN, API_DOMAIN, ACME_EMAIL in .env, then:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# =============================================================================

services:
  traefik:
    image: traefik:v3
    container_name: myerp-proxy
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=myerp-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - myerp_letsencrypt:/letsencrypt
    networks:
      - myerp-network

  api:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
    environment:
      App__SelfUrl: "https://${API_DOMAIN}"
      App__CorsOrigins: "https://${WEB_DOMAIN}"
      App__AngularUrl: "https://${WEB_DOMAIN}"
      App__RedirectAllowedUrls: "https://${WEB_DOMAIN}"
      AuthServer__Authority: "https://${API_DOMAIN}"
      AuthServer__RequireHttpsMetadata: "true"

  web:
    # !override clears the base compose's "80:80" mapping (plain [] would merge, not replace),
    # so only Traefik binds host 80/443.
    ports: !override []
    environment:
      API_URL: "https://${API_DOMAIN}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=80"

volumes:
  myerp_letsencrypt:
    driver: local
